name: morra_vda
description: 'Mobile app for Morra Valdostana tournaments: stage calendar, QR check-in, offline score counter, live standings and season rankings.'
publish_to: 'none' # Not meant for pub.dev

version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
