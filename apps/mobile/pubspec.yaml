name: morra_vda
description: 'Mobile app for Morra Valdostana tournaments: stage calendar, QR check-in, offline score counter, live standings and season rankings.'
publish_to: none

version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  morra_rules:
    path: ../../packages/morra_rules
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
